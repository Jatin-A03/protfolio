name: Update Codeforces stats

on:
  schedule:
    - cron: "37 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Fetch Codeforces stats
        env:
          CODEFORCES_HANDLE: A_Jatin
        run: node scripts/fetch-codeforces.mjs

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/codeforces.json
          if git diff --cached --quiet; then
            echo "Codeforces stats have not changed."
          else
            git commit -m "chore: update Codeforces stats"
            git push
          fi