name: Update LeetCode stats

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch LeetCode stats
        env:
          LEETCODE_USERNAME: A_Jatin
        run: node scripts/fetch-leetcode.mjs

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leetcode.json
          if git diff --cached --quiet; then
            echo "LeetCode stats have not changed."
          else
            git commit -m "chore: update LeetCode stats"
            git push
          fi